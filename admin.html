<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন প্যানেল - Mirinja Heaven Resort</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="admin-body">

    <header class="navbar admin-nav">
        <div class="logo">
            <i class="fa-solid fa-user-shield"></i> এডমিন ড্যাশবোর্ড
        </div>
        <a href="index.html" class="btn-secondary"><i class="fa-solid fa-globe"></i> মূল ওয়েবসাইট</a>
    </header>

    <div class="container admin-container">
        <h2><i class="fa-solid fa-list-check"></i> প্রাপ্ত সমস্ত বুকিং রিকোয়েস্ট</h2>
        <div class="table-responsive">
            <table class="booking-table">
                <thead>
                    <tr>
                        <th>তারিখ</th>
                        <th>গ্রাহকের নাম</th>
                        <th>ফোন</th>
                        <th>কটেজ</th>
                        <th>চেক-ইন / চেক-আউট</th>
                        <th>গেস্ট</th>
                        <th>পেমেন্ট</th>
                        <th>TrxID</th>
                        <th>মোট টাকা</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr>
                        <td colspan="10" style="text-align: center;">ডাটা লোড হচ্ছে...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadAdminBookings === 'function') {
                loadAdminBookings();
            }
        });
    </script>
</body>
</html>
